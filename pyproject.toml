[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mergepdf"
version = "0.1.0"
description = "A simple CLI tool to merge PDF files with PyPDF2"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyPDF2>=3.0.0",
]

[project.scripts]
mergepdf = "mergepdf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
